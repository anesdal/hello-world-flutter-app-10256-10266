name: ride_karo
description: "Ride Karo - Flutter migration of the Connected Living Android app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  url_launcher: ^6.2.2
  intl: ^0.19.0
  http: ^1.2.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/

  fonts:
    - family: LatoRegular
      fonts:
        - asset: assets/fonts/lato_regular.ttf
    - family: LatoBold
      fonts:
        - asset: assets/fonts/lato_bold.ttf
    - family: LatoBlack
      fonts:
        - asset: assets/fonts/lato_black.ttf
    - family: ProductSans
      fonts:
        - asset: assets/fonts/product_sans_regular.ttf
